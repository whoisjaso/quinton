<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Quinton, One Thought</title>
<link rel="stylesheet" href="../lux/fonts-local.css" />
<style>
  @font-face { font-family: "Archivo"; src: url("../archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; background: #0a0908; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a0908; color: #f6ead0; font-family: "Cormorant", Georgia, serif; }
  .layer { position: absolute; inset: 0; }
  #bgs { z-index: 0; isolation: isolate; }
  #cam { transform-origin: 540px 960px; }
  .bg { position: absolute; inset: 0; overflow: hidden; display: none; }
  .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,9,8,0.72) 0%, rgba(10,9,8,0.35) 38%, rgba(10,9,8,0.55) 62%, rgba(10,9,8,0.9) 100%); }
  .th { position: absolute; white-space: nowrap; font-style: italic; font-weight: 500; transform-origin: 0 50%; display: none; }
  .ln { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-weight: 300; line-height: 1.04; display: none; }
  .ln span { display: inline-block; }
  #dot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #f0d49a; box-shadow: 0 0 22px 6px rgba(233,190,110,0.55), 0 0 70px 20px rgba(201,163,95,0.2); }
  #rule { position: absolute; height: 3px; background: #e9cf96; box-shadow: 0 0 14px 3px rgba(233,190,110,0.45); display: none; }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff3d6 0%, #e2c180 30%, rgba(154,116,64,0.6) 62%, rgba(10,9,8,0) 100%); opacity: 0; }
  .card { position: absolute; left: 60px; width: 960px; border-radius: 34px; background: rgba(28,25,21,0.82); border: 1px solid rgba(201,163,95,0.28); box-shadow: 0 24px 60px rgba(0,0,0,0.45); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); font-family: "Archivo", Arial, sans-serif; color: #f3ead8; display: none; padding: 30px 34px 32px; box-sizing: border-box; }
  .card .hd { display: flex; align-items: center; gap: 18px; font-size: 25px; letter-spacing: 0.06em; text-transform: uppercase; color: #b9ae98; }
  .card .ic { width: 58px; height: 58px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-family: "Cormorant", serif; font-size: 40px; font-weight: 500; }
  .card .gold { background: linear-gradient(145deg, #f2d9a0, #b8904d); color: #17130d; }
  .card .grey { background: #3a3732; color: #f3ead8; font-family: "Archivo"; font-size: 28px; font-weight: 600; }
  .card .time { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .card .tt { font-size: 36px; font-weight: 600; margin-top: 20px; }
  .card .bd { font-size: 33px; line-height: 1.32; margin-top: 8px; color: #e4dac6; }
  .card .thumbs { display: flex; gap: 14px; margin-top: 20px; }
  .card .thumbs img { width: 200px; height: 150px; object-fit: cover; border-radius: 14px; }
  #lock { position: absolute; left: 0; right: 0; text-align: center; font-family: "Archivo", Arial, sans-serif; display: none; }
  #lock .d { font-size: 34px; font-weight: 500; color: #efe4cf; }
  #lock .t { font-size: 190px; font-weight: 200; letter-spacing: -0.02em; color: #f6ecd8; line-height: 1; margin-top: 6px; }
  #mark { position: absolute; left: 0; right: 0; text-align: center; text-transform: uppercase; font-weight: 400; display: none; }
  .center { position: absolute; left: 0; right: 0; text-align: center; display: none; }
  .caps { font-weight: 500; text-transform: uppercase; letter-spacing: 0.32em; color: #c9a35f; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 50%, rgba(6,5,4,0.75) 100%); }
  #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bgs"></div>
  <div class="layer" id="cam">
    <svg class="layer" id="rings" width="1080" height="1920"></svg>
    <div class="layer" id="thoughts"></div>
  </div>
  <div class="layer" id="lines"></div>
  <div id="lock"><div class="d" id="lockd"></div><div class="t" id="lockt"></div></div>
  <div class="layer" id="cards"></div>
  <div id="flash"></div>
  <div id="mark">Quinton</div>
  <div class="center caps" id="desc" style="font-size:28px">Estate &amp; Commercial Grounds</div>
  <div class="center" id="svc" style="font-size:40px;font-weight:400;color:#e4d6b8;letter-spacing:0.02em">Lawn Care · Power Washing · Storefronts</div>
  <div class="center" id="cta" style="font-size:48px;font-weight:500;letter-spacing:0.04em"><span style="display:inline-block;border:1.5px solid #c9a35f;padding:24px 56px">Request a Walkthrough</span></div>
  <div class="center" id="phone" style="font-size:52px;letter-spacing:0.06em">(281) 788-6172</div>
  <div class="center caps" id="area" style="font-size:24px">Greater Houston</div>
  <div id="rule"></div>
  <div id="dot"></div>
  <div id="vig"></div>
  <img id="grain" src="../lux/assets/grain0.png" />
</div>
<script src="kit.js"></script>
<script>
/* QUINTON, "One Thought". 30 s, 60 fps (1800 f), 1080x1920, seamless loop (frame 1799 flows into frame 0).
   Idea: stop carrying the property in your head.
   Device: one gold dot, one thought. It multiplies into every worry, collapses back into one point on
   "Handled.", becomes the Quinton notification on their phone, then the rule under the name, then the dot again.
   Grammar: inside the owner's head (italic, orbiting, cold) until the turn; after it, their future (upright, still, warm). */
const W = 1080, H = 1920, END = 1800, CX = 540, CY = 960;
const E = K.E;
const $ = (id) => document.getElementById(id);
const show = (el, on) => (el.style.display = on ? "block" : "none");
const IMG = (n) => `../lux/assets/${n}.jpg`;

// ── the spiral: every worry the owner carries ──
const TH = [
  { t: 22,  s: "Did the crew even show up?",        r: 250, a: -1.75, z: 54 },
  { t: 92,  s: "Clippings all over the walkway.",   r: 310, a: 0.55,  z: 50 },
  { t: 146, s: "Is that gum by the entrance?",      r: 380, a: 1.95,   z: 50 },
  { t: 190, s: "Why is the patio turning green?",   r: 520, a: -0.55, z: 46 },
  { t: 228, s: "Guests arrive Friday.",             r: 300, a: 1.6,   z: 52, gold: true },
  { t: 262, s: "Another no-show.",                  r: 600, a: 3.5,   z: 46 },
  { t: 290, s: "Who do I even call?",               r: 460, a: -2.6,  z: 44 },
  { t: 314, s: "The listing photos are tomorrow.",  r: 680, a: 0.2,   z: 40 },
  { t: 334, s: "The edges look ragged.",            r: 380, a: -1.1,  z: 42 },
  { t: 350, s: "They noticed.",                     r: 560, a: 2.1,   z: 48, gold: true },
  { t: 364, s: "Of course they noticed.",           r: 740, a: -2.0,  z: 38 },
  { t: 376, s: "Again?",                            r: 260, a: 0.9,   z: 44 },
  { t: 388, s: "What does this say about us?",      r: 640, a: 1.15,  z: 38 },
  { t: 398, s: "Another weekend gone.",             r: 800, a: 2.9,   z: 36 },
  { t: 408, s: "Is it the parking lot?",            r: 500, a: -0.2,  z: 36 },
  { t: 416, s: "again",                             r: 360, a: 3.1,   z: 34 },
  { t: 424, s: "Who left that there?",              r: 720, a: -1.5,  z: 34 },
  { t: 431, s: "what if",                           r: 840, a: 0.6,   z: 32 },
  { t: 437, s: "too late?",                         r: 440, a: 2.4,   z: 34 },
  { t: 443, s: "again",                             r: 620, a: -2.9,  z: 32 },
  { t: 448, s: "Friday.",                           r: 900, a: 1.9,   z: 32 },
  { t: 453, s: "who do I call",                     r: 540, a: -0.8,  z: 30 },
  { t: 458, s: "they noticed",                      r: 780, a: 2.6,   z: 30 },
  { t: 462, s: "again",                             r: 980, a: -1.9,  z: 30 },
];
const RINGS = [250, 420, 600, 800, 980];
const FREEZE = 560, IMPL = 672, DROP = 690;

// global orbit phase: angular speed ramps up as the worry builds, then stops dead on the freeze
function phase(f) {
  const ff = Math.min(f, FREEZE), p = K.clamp((ff - 20) / (FREEZE - 20));
  const w0 = 0.0015, w1 = 0.016;
  return w0 * Math.max(0, ff - 20) + (w1 - w0) * (FREEZE - 20) * p * p * p / 3;
}

// ── backgrounds for the future ──
const BG = [
  { img: "g-hero-estate-dusk", from: 846, to: 1146, s: [1.14, 1.02], pos: "42% 50%" },
  { img: "g-storefront",       from: 1130, to: 1272, s: [1.18, 1.06], pos: "50% 50%" },
  { img: "g-modern-dusk-lawn", from: 1258, to: 1404, s: [1.12, 1.0],  pos: "50% 50%" },
  { img: "g-turf-macro",       from: 1400, to: 1426, s: [1.3, 1.22],  pos: "50% 70%" },
  { img: "g-hardscape-pool-deck", from: 1424, to: 1450, s: [1.3, 1.22], pos: "28% 60%" },
  { img: "g-garden-path",      from: 1448, to: 1474, s: [1.3, 1.22],  pos: "50% 60%" },
  { img: "g-storefront",       from: 1472, to: 1512, s: [1.36, 1.2],  pos: "50% 50%" },
];

// ── lines (serif statements). upright, centred, title case ──
const LINES = [
  { t: 574,  out: 664,  ws: [["You", "Notice", "Everything."]], y: 1250, z: 108 },
  { t: 618,  out: 664,  ws: [["So", "Do", "They."]], y: 1380, z: 108, gold: true },
  { t: 700,  out: 778,  ws: [["Handled."]], y: 1040, z: 190 },
  { t: 792,  out: 840,  ws: [["Picture", "Next", "Friday."]], y: 1120, z: 112 },
  { t: 1062, out: 1124, ws: [["Everything's", "Ready."], ["You", "Didn't", "Lift", "a", "Finger."]], y: 1500, z: 84 },
  { t: 1186, out: 1252, ws: [["Doors", "Open", "to", "a"], ["Spotless", "Entrance."]], y: 1500, z: 92 },
  { t: 1276, out: 1394, ws: [["You", "Haven't", "Thought"], ["About", "It", "in", "Months."]], y: 1420, z: 108, slow: true },
  { t: 1402, out: 1414, ws: [["Lawn", "Care."]], y: 1440, z: 132, fast: true },
  { t: 1426, out: 1438, ws: [["Power", "Washing."]], y: 1440, z: 132, fast: true },
  { t: 1450, out: 1462, ws: [["Hedges", "and", "Beds."]], y: 1440, z: 132, fast: true },
  { t: 1476, out: 1486, ws: [["Storefronts."]], y: 1440, z: 132, fast: true },
];

// ── the future, as it arrives on their phone ──
const CARDS = [
  { t: 858, out: 1132, y: 600, icon: "Q", cls: "gold", app: "Quinton", time: "now", tt: "Visit complete",
    bd: "Lawn cut, edges by hand, front walk power washed. 14 photos.", thumbs: ["g-turf-macro", "g-hardscape-pool-deck", "g-garden-path"] },
  { t: 958, out: 1132, y: 1070, icon: "N", cls: "grey", app: "Messages", time: "6:51 PM", tt: "Next door", bd: "Okay. Who does your lawn?" },
  { t: 1140, out: 1256, y: 600, icon: "Q", cls: "gold", app: "Quinton", time: "6:12 AM", tt: "Entrance ready before open",
    bd: "Sidewalk and entry power washed. Gum removed. 9 photos." },
];
const LOCKS = [
  { from: 846, to: 1132, d: "Friday, October 24", t: "6:48" },
  { from: 1132, to: 1258, d: "Monday, October 27", t: "6:12" },
];

// ── build ──
const svg = $("rings");
RINGS.forEach((r) => { const c = K.svg("circle", { cx: CX, cy: CY, r, fill: "none", stroke: "#c9a35f", "stroke-width": 1.2, opacity: 0 }, svg); c.dataset.r = r; });
TH.forEach((t) => { const e = document.createElement("div"); e.className = "th"; e.textContent = t.s; $("thoughts").appendChild(e); t.el = e; });
BG.forEach((b) => { const d = document.createElement("div"); d.className = "bg"; const im = document.createElement("img"); im.src = IMG(b.img); im.style.objectPosition = b.pos; d.appendChild(im); const sh = document.createElement("div"); sh.className = "shade"; d.appendChild(sh); $("bgs").appendChild(d); b.el = d; b.im = im; });
LINES.forEach((l) => (l.els = l.ws.map(() => { const e = document.createElement("div"); e.className = "ln"; $("lines").appendChild(e); return e; })));
CARDS.forEach((c) => {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="hd"><div class="ic ${c.cls}">${c.icon}</div><span>${c.app}</span><span class="time">${c.time}</span></div><div class="tt">${c.tt}</div><div class="bd">${c.bd}</div>` +
    (c.thumbs ? `<div class="thumbs">${c.thumbs.map((n) => `<img src="${IMG(n)}">`).join("")}</div>` : "");
  $("cards").appendChild(d); c.el = d;
});

// statement line: each word rises through its own mask and unblurs
function lineFX(el, words, f, { y, z, out, fast, slow, gold }) {
  if (f < words[0].t - 1 || f > out + 26) return show(el, false);
  show(el, true);
  const dur = fast ? 14 : slow ? 40 : 26;
  el.innerHTML = words.map((wd, i) => {
    const p = E.out(K.prog(f, wd.t, dur)), q = E.exit(K.prog(f, out + (fast ? 0 : i * 2), fast ? 8 : 14));
    const blur = (1 - p) * 9 + q * 7;
    return `<span style="overflow:hidden;padding:0.06em 0.05em 0.16em;margin:0 0.1em -0.16em;vertical-align:top"><span style="transform:translateY(${(1 - p) * 70 - q * 30}%);opacity:${K.clamp(p * 1.4) * (1 - q)}${blur > 0.05 ? `;filter:blur(${blur.toFixed(2)}px)` : ""}">${wd.w}</span></span>`;
  }).join("");
  Object.assign(el.style, { top: y + "px", fontSize: z + "px", color: gold ? "#e2c385" : "#f6ead0" });
}

// beats of the worry: ticks and heartbeats accelerate (ratchet) into the freeze
const TICKS = [], BEATS = [];
for (let f = 30, g = 34; f < FREEZE; f += g, g = Math.max(5, g * 0.93)) TICKS.push(Math.round(f));
for (let f = 60, g = 70; f < FREEZE - 10; f += g, g = Math.max(24, g * 0.9)) BEATS.push(Math.round(f));

function seek(t) {
  const f = Math.round(t * 60);
  $("grain").src = `../lux/assets/grain${f % 6}.png`;

  // ── act 1: inside their head ──
  const ph = phase(f);
  const push = f < FREEZE ? K.lmix(1, 1.16, E.smooth(K.prog(f, 20, FREEZE - 20))) : 1.16;
  const implode = E.contact(K.prog(f, IMPL, DROP - IMPL));
  $("cam").style.transform = `scale(${push})`;
  const headOn = f < DROP + 2;
  show($("cam"), headOn);
  if (headOn) {
    // rings draw on as the worry widens, dim on the freeze, fold into the dot on the implode
    svg.querySelectorAll("circle").forEach((c, i) => {
      const r = +c.dataset.r, born = 40 + i * 70;
      const d = E.out(K.prog(f, born, 60));
      const len = 2 * Math.PI * r;
      c.setAttribute("stroke-dasharray", `${len * d} ${len}`);
      c.setAttribute("transform", `rotate(${(ph * (i % 2 ? -40 : 40)) % 360} ${CX} ${CY})`);
      c.setAttribute("r", r * (1 - implode));
      c.setAttribute("opacity", (0.22 + 0.1 * (i % 2)) * (f >= FREEZE ? 0.6 : 1) * (1 - implode));
    });
    TH.forEach((th, i) => {
      if (f < th.t - 1) return show(th.el, false);
      show(th.el, true);
      const dir = i % 2 ? -1 : 1;
      const ang = th.a + ph * dir * (0.9 + (i % 3) * 0.25);
      const r = th.r * (1 - implode);
      const x = CX + Math.cos(ang) * r, y = CY + Math.sin(ang) * r * 0.92;
      const p = E.out(K.prog(f, th.t, 18));
      const age = TH.filter((o) => o.t > th.t && f >= o.t).length;
      let op = p * Math.max(0.34, 1 - age * 0.07);
      if (f >= FREEZE) op *= 0.35;
      op *= 1 - E.in(K.clamp(implode * 1.2));
      const sc = (1 - implode * 0.95) * (0.92 + 0.08 * p);
      Object.assign(th.el.style, {
        left: x + "px", top: y + "px", fontSize: th.z * 1.45 + "px", opacity: op,
        color: th.gold ? "#ecc982" : "#efe6d4",
        transform: `translate(-50%, -50%) scale(${sc})`,
        filter: p < 1 ? `blur(${((1 - p) * 8).toFixed(2)}px)` : "none",
      });
    });
  }

  // ── the dot: one thought. pulses with the heartbeat; on the turn it becomes the app icon, then the rule ──
  let dx = CX, dy = CY, ds = 1, dop = 1;
  const beat = BEATS.reduce((m, b) => Math.max(m, K.hit(f - b, 2, 6), K.hit(f - b - 11, 2, 6) * 0.6), 0);
  ds = 1 + beat * 0.55;
  if (f >= IMPL && f < DROP) ds = 1 + 1.6 * implode;
  if (f >= DROP) ds = 1 + 4 * K.hit(f - DROP, 2, 9);
  // the dot travels up to become the Quinton icon on the first notification
  if (f >= 836 && f < 1132) {
    const m = E.inOut(K.prog(f, 836, 24));
    dx = K.lerp(CX, 60 + 34 + 29, m); dy = K.lerp(CY, 600 + 30 + 29, m);
    ds = K.lerp(1, 0.2, m); dop = 1 - K.prog(f, 856, 6);
  } else if (f >= 1132 && f < 1500) dop = 0;
  if (f >= 1500) {
    // returns at the centre of the end card and stretches into the rule
    dop = E.smooth(K.prog(f, 1500, 14)); dy = 906;
    if (f >= 1528) dop = 0;
  }
  if (f >= 1722) {
    // loop tail: the rule folds back into the dot at the centre, exactly as frame 0 begins
    const b = E.inOut(K.prog(f, 1756, 30));
    dop = E.smooth(K.prog(f, 1748, 12)); dy = K.lerp(906, CY, b); ds = 1;
  }
  Object.assign($("dot").style, { left: dx + "px", top: dy + "px", transform: `scale(${ds})`, opacity: dop });

  // the flood of light on the turn
  $("flash").style.opacity = Math.min(1, K.hit(f - DROP, 3, 9) * 1.1);

  // ── act 2: their future ──
  BG.forEach((b, i) => {
    const vis = f >= b.from && f < b.to;
    show(b.el, vis);
    if (!vis) return;
    const kp = E.dolly(K.prog(f, b.from, b.to - b.from));
    b.im.style.transform = `scale(${K.lmix(b.s[0], b.s[1], kp)})`;
    const fin = i < 3 ? E.smooth(K.prog(f, b.from, 22)) : 1;
    const fout = i === 6 ? 1 - E.smooth(K.prog(f, 1496, 16)) : 1;
    b.el.style.opacity = fin * fout; b.el.style.zIndex = i;
  });
  // lock screen clock
  const lk = LOCKS.find((l) => f >= l.from && f < l.to);
  if (lk) {
    show($("lock"), true);
    const p = E.out(K.prog(f, lk.from, 30)), q = E.exit(K.prog(f, lk.to - 16, 16));
    $("lockd").textContent = lk.d; $("lockt").textContent = lk.t;
    Object.assign($("lock").style, { top: "200px", opacity: p * (1 - q), transform: `translateY(${(1 - p) * -30}px)` });
  } else show($("lock"), false);
  CARDS.forEach((c) => {
    if (f < c.t - 1 || f > c.out + 20) return show(c.el, false);
    show(c.el, true);
    const p = K.crit(f - c.t, 0.16), q = E.exit(K.prog(f, c.out, 18));
    Object.assign(c.el.style, { top: c.y + "px", opacity: K.clamp(p * 1.6) * (1 - q), transform: `translateY(${(1 - p) * -90 - q * 60}px) scale(${0.96 + 0.04 * p})` });
  });

  LINES.forEach((l) => l.ws.forEach((ws, li) => {
    const st = l.fast ? 3 : l.slow ? 9 : 6;
    const words = ws.map((w, wi) => ({ t: l.t + li * 9 + wi * st, w }));
    lineFX(l.els[li], words, f, { y: l.y + li * l.z * 1.06, z: l.z, out: l.out + li * 3, fast: l.fast, slow: l.slow, gold: l.gold });
  }));

  // ── the name ──
  const tail = f >= 1722 ? 1 - E.smooth(K.prog(f, 1722, 34)) : 1;
  if (f >= 1508) {
    show($("mark"), true);
    const p = E.out(K.prog(f, 1510, 46));
    Object.assign($("mark").style, { top: "760px", fontSize: "116px", letterSpacing: `${0.6 - 0.22 * p}em`, paddingLeft: `${0.6 - 0.22 * p}em`, opacity: E.smooth(K.prog(f, 1510, 28)) * tail, filter: `blur(${((1 - p) * 8 + (1 - tail) * 8).toFixed(2)}px)` });
  } else show($("mark"), false);
  // the dot becomes the rule, then (loop tail) folds back into the dot
  if (f >= 1520) {
    let w = 3 + 417 * E.out(K.prog(f, 1520, 32));
    if (f >= 1722) w = 3 + (w - 3) * (1 - E.in(K.prog(f, 1728, 26)));
    const vis = f < 1756;
    if (vis) { show($("rule"), true); Object.assign($("rule").style, { left: CX - w / 2 + "px", top: "905px", width: w + "px" }); }
    else show($("rule"), false);
  } else show($("rule"), false);
  const up = (el, t0, top) => {
    if (f < t0) return show(el, false);
    show(el, true);
    const p = E.out(K.prog(f, t0, 32));
    Object.assign(el.style, { top: top + "px", opacity: p * tail, transform: `translateY(${(1 - p) * 20}px)` });
  };
  up($("desc"), 1540, 948); up($("svc"), 1560, 1010); up($("cta"), 1590, 1130); up($("phone"), 1608, 1300); up($("area"), 1618, 1380);
}

window.ready = () => seek(0);
